<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>بيانات المعلمين | مدرسة السادات الثانوية بنين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
      --green-dark: #082d20;
      --green: #166448;
      --gold: #cfa12b;
      --bg: #f8f6f0;
      --surface: #fff;
      --text: #141e19;
      --muted: #53625b;
      --border: rgba(14, 69, 50, 0.12);
      font-family: 'Cairo', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #eaf6f0, var(--bg) 60%);
      color: var(--text);
    }

    main {
      width: min(100%, 560px);
      padding: clamp(24px, 5vw, 44px);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 16px 42px rgba(8, 45, 32, 0.12);
    }

    .school-mark {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      place-items: center;
      border-radius: 50%;
      background: #eaf6f0;
      color: var(--green);
      font-size: 1.6rem;
    }

    h1, .intro { text-align: center; }

    h1 {
      margin: 0;
      color: var(--green-dark);
      font-size: clamp(1.45rem, 5vw, 1.9rem);
    }

    .intro {
      margin: 8px 0 26px;
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: var(--green);
      outline: 3px solid rgba(30, 131, 94, 0.16);
    }

    button, .back-link {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      background: linear-gradient(135deg, var(--gold), #f5cf53);
      color: var(--green-dark);
      cursor: pointer;
    }

    .message {
      min-height: 27px;
      margin: 10px 0 0;
      color: #b42318;
      text-align: center;
    }

    .teacher-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-right: 4px solid var(--gold);
      border-radius: 14px;
      background: #fbfdfb;
    }

    .teacher-card h2 {
      margin: 0 0 8px;
      color: var(--green-dark);
      font-size: 1.25rem;
    }

    .teacher-card p { margin: 0; color: var(--muted); }
    .teacher-card strong { color: var(--text); }

    .back-link {
      width: 100%;
      margin-top: 20px;
      border: 1px solid var(--border);
      color: var(--green);
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="school-mark" aria-hidden="true"><i class="fa-solid fa-chalkboard-user"></i></div>
    <h1>بيانات المعلمين</h1>
    <p class="intro">مدرسة السادات الثانوية بنين</p>

    <form id="loginForm">
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> تسجيل الدخول</button>
      <p class="message" id="loginMessage" role="alert" aria-live="polite"></p>
    </form>

    <section id="teacherList" hidden aria-labelledby="teacherListTitle">
      <h2 id="teacherListTitle" class="intro">قائمة المعلمين</h2>
      <article class="teacher-card">
        <h2>أ/ سيد سالم حسين</h2>
        <p><strong>الوظيفة:</strong> التطور التكنولوجي</p>
      </article>
      <button type="button" id="logoutButton"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i> تسجيل الخروج</button>
    </section>

    <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i> العودة إلى الصفحة الرئيسية</a>
  </main>

  <script>
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const loginMessage = document.getElementById('loginMessage');
    const teacherList = document.getElementById('teacherList');

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (passwordInput.value !== 'AAaa#####@@$elsadat') {
        loginMessage.textContent = 'كلمة المرور غير صحيحة. حاول مرة أخرى.';
        passwordInput.select();
        return;
      }

      loginMessage.textContent = '';
      loginForm.hidden = true;
      teacherList.hidden = false;
    });

    document.getElementById('logoutButton').addEventListener('click', () => {
      teacherList.hidden = true;
      loginForm.hidden = false;
      passwordInput.value = '';
      passwordInput.focus();
    });
  </script>
</body>
</html>
